<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenSpec Workflow SVG</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f8fafc;
      }
      .frame {
        max-width: 1100px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 12px;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <img src="openspec_workflow.svg" alt="OpenSpec workflow diagram" />
    </div>
  </body>
</html>
