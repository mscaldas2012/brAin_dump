<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>AI-Driven Development Maturity Model</title>
  <desc>Five-level maturity model from vibe coding to AI-orchestrated delivery systems</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <line x1="36" y1="60" x2="36" y2="550" stroke="#aaa" stroke-width="1" marker-end="url(#arr)"/>
  <text x="14" y="310" font-size="11" fill="#999" font-family="sans-serif" text-anchor="middle" transform="rotate(-90,14,310)">Maturity</text>

  <rect x="46" y="55" width="620" height="78" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="0.8"/>
  <text x="58" y="76" font-size="11" fill="#6D28D9" font-family="sans-serif" font-weight="500">Level 5</text>
  <text x="58" y="95" font-size="14" fill="#4C1D95" font-family="sans-serif" font-weight="600">AI-orchestrated delivery systems</text>
  <text x="58" y="114" font-size="11" fill="#5B21B6" font-family="sans-serif">Multi-agent teams · specialized roles · quality gates at every handoff · org-wide governance</text>
  <text x="658" y="95" font-size="11" fill="#7C3AED" font-family="sans-serif" text-anchor="end">e.g. BMAD</text>

  <rect x="46" y="149" width="554" height="78" rx="8" fill="#CCFBF1" stroke="#0F766E" stroke-width="0.8"/>
  <text x="58" y="170" font-size="11" fill="#0F766E" font-family="sans-serif" font-weight="500">Level 4</text>
  <text x="58" y="189" font-size="14" fill="#134E4A" font-family="sans-serif" font-weight="600">Governed AI engineering</text>
  <text x="58" y="208" font-size="11" fill="#115E59" font-family="sans-serif">Phase-gated specs · human review checkpoints · constitution enforced · entropy constrained</text>
  <text x="592" y="189" font-size="11" fill="#0F766E" font-family="sans-serif" text-anchor="end">e.g. SpecKit</text>

  <rect x="46" y="243" width="488" height="78" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="0.8"/>
  <text x="58" y="264" font-size="11" fill="#1D4ED8" font-family="sans-serif" font-weight="500">Level 3</text>
  <text x="58" y="283" font-size="14" fill="#1E3A8A" font-family="sans-serif" font-weight="600">Spec-driven AI development</text>
  <text x="58" y="302" font-size="11" fill="#1E40AF" font-family="sans-serif">Specs as persistent memory · propose → apply → archive · changes are traceable</text>
  <text x="526" y="283" font-size="11" fill="#1D4ED8" font-family="sans-serif" text-anchor="end">e.g. OpenSpec</text>

  <rect x="46" y="337" width="422" height="78" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8"/>
  <text x="58" y="358" font-size="11" fill="#D97706" font-family="sans-serif" font-weight="500">Level 2</text>
  <text x="58" y="377" font-size="14" fill="#78350F" font-family="sans-serif" font-weight="600">AI operational literacy</text>
  <text x="58" y="396" font-size="11" fill="#92400E" font-family="sans-serif">CLAUDE.md · reusable prompts · persistent context files · intentional context engineering</text>

  <rect x="46" y="431" width="356" height="78" rx="8" fill="#FFE4E6" stroke="#E11D48" stroke-width="0.8"/>
  <text x="58" y="452" font-size="11" fill="#E11D48" font-family="sans-serif" font-weight="500">Level 1</text>
  <text x="58" y="471" font-size="14" fill="#881337" font-family="sans-serif" font-weight="600">Exploratory AI development</text>
  <text x="58" y="490" font-size="11" fill="#9F1239" font-family="sans-serif">Ad-hoc prompting · no persistent context · output quality depends on session luck</text>
  <text x="394" y="471" font-size="11" fill="#E11D48" font-family="sans-serif" text-anchor="end">vibe coding</text>

  <rect x="46" y="526" width="620" height="62" rx="8" fill="none" stroke="#ccc" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="356" y="548" font-size="11" fill="#666" font-family="sans-serif" text-anchor="middle">Key shift 1→2: developer moves from reactive prompter to intentional context engineer.</text>
  <text x="356" y="566" font-size="11" fill="#666" font-family="sans-serif" text-anchor="middle">Key shift 3→4: AI moves from creative collaborator to constrained executor. Flexibility trades for predictability.</text>
</svg>
