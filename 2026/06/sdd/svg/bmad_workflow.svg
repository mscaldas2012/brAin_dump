  <text x="272" y="124" font-size="10" fill="#5B21B6" font-family="sans-serif" text-anchor="middle">Epics · user stories ·</text>
  <text x="272" y="138" font-size="10" fill="#5B21B6" font-family="sans-serif" text-anchor="middle">acceptance criteria ·</text>
  <text x="272" y="152" font-size="10" fill="#5B21B6" font-family="sans-serif" text-anchor="middle">prioritization</text>

  <line x1="328" y1="124" x2="342" y2="124" stroke="#6D28D9" stroke-width="1" marker-end="url(#arr)"/>
  <polygon points="358,108 378,124 358,140 338,124" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8"/>
  <text x="358" y="120" font-size="9" font-weight="600" fill="#78350F" font-family="sans-serif" text-anchor="middle">Gate</text>
  <text x="358" y="132" font-size="9" fill="#92400E" font-family="sans-serif" text-anchor="middle">2</text>
  <line x1="378" y1="124" x2="392" y2="124" stroke="#D97706" stroke-width="1" marker-end="url(#arr-gate)"/>

  <rect x="392" y="88" width="112" height="72" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="0.8"/>
  <text x="448" y="108" font-size="11" font-weight="600" fill="#4C1D95" font-family="sans-serif" text-anchor="middle">Architect</text>
  <text x="448" y="124" font-size="10" fill="#5B21B6" font-family="sans-serif" text-anchor="middle">System design ·</text>
  <text x="448" y="138" font-size="10" fill="#5B21B6" font-family="sans-serif" text-anchor="middle">tech decisions ·</text>
  <text x="448" y="152" font-size="10" fill="#5B21B6" font-family="sans-serif" text-anchor="middle">architecture doc</text>

  <line x1="504" y1="124" x2="518" y2="124" stroke="#6D28D9" stroke-width="1" marker-end="url(#arr)"/>
  <polygon points="534,108 554,124 534,140 514,124" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8"/>
  <text x="534" y="120" font-size="9" font-weight="600" fill="#78350F" font-family="sans-serif" text-anchor="middle">Gate</text>
  <text x="534" y="132" font-size="9" fill="#92400E" font-family="sans-serif" text-anchor="middle">3</text>
  <line x1="554" y1="124" x2="568" y2="124" stroke="#D97706" stroke-width="1" marker-end="url(#arr-gate)"/>

  <rect x="568" y="88" width="100" height="72" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="0.8"/>
  <text x="618" y="108" font-size="11" font-weight="600" fill="#4C1D95" font-family="sans-serif" text-anchor="middle">Developer</text>
  <text x="618" y="124" font-size="10" fill="#5B21B6" font-family="sans-serif" text-anchor="middle">Story-by-story</text>
  <text x="618" y="138" font-size="10" fill="#5B21B6" font-family="sans-serif" text-anchor="middle">implementation ·</text>
  <text x="618" y="152" font-size="10" fill="#5B21B6" font-family="sans-serif" text-anchor="middle">self-validates</text>

  <path d="M618 160 Q618 196 534 206 Q450 196 450 184" fill="none" stroke="#6D28D9" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arr)"/>
  <rect x="470" y="184" width="120" height="36" rx="6" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="0.8"/>
  <text x="530" y="200" font-size="10" font-weight="600" fill="#4C1D95" font-family="sans-serif" text-anchor="middle">Scrum master</text>
  <text x="530" y="213" font-size="10" fill="#5B21B6" font-family="sans-serif" text-anchor="middle">tracks story status</text>

  <rect x="470" y="238" width="120" height="52" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="0.8"/>
  <text x="530" y="258" font-size="11" font-weight="600" fill="#4C1D95" font-family="sans-serif" text-anchor="middle">QA agent</text>
  <text x="530" y="274" font-size="10" fill="#5B21B6" font-family="sans-serif" text-anchor="middle">Independent verification ·</text>
  <text x="530" y="288" font-size="10" fill="#5B21B6" font-family="sans-serif" text-anchor="middle">regression checks</text>

  <line x1="530" y1="220" x2="530" y2="238" stroke="#6D28D9" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="40" y="318" width="400" height="150" rx="8" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="0.8"/>
  <text x="56" y="340" font-size="11" font-weight="600" fill="#4C1D95" font-family="sans-serif">Artifact chain (docs as source of truth)</text>
  <text x="56" y="358" font-size="10" fill="#5B21B6" font-family="monospace">brief.md → prd.md → architecture.md</text>
  <text x="56" y="374" font-size="10" fill="#5B21B6" font-family="monospace">    → user-stories.md → tasks/</text>
  <text x="56" y="394" font-size="10" fill="#5B21B6" font-family="sans-serif">Each artifact is a formal handoff contract between agents.</text>
  <text x="56" y="410" font-size="10" fill="#5B21B6" font-family="sans-serif">An agent cannot proceed without the prior artifact passing</text>
  <text x="56" y="426" font-size="10" fill="#5B21B6" font-family="sans-serif">its quality gate. Source code is regenerable output;</text>
  <text x="56" y="442" font-size="10" fill="#5B21B6" font-family="sans-serif">documentation is the system of record.</text>
  <text x="56" y="460" font-size="10" fill="#7C3AED" font-family="sans-serif" font-weight="500">Scale-adaptive: adjusts planning depth from bug fix → enterprise</text>

  <rect x="460" y="318" width="200" height="150" rx="8" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="0.8"/>
  <text x="476" y="340" font-size="11" font-weight="600" fill="#4C1D95" font-family="sans-serif">Agent roster</text>
  <text x="476" y="358" font-size="10" fill="#5B21B6" font-family="sans-serif">• Analyst</text>
  <text x="476" y="374" font-size="10" fill="#5B21B6" font-family="sans-serif">• Product manager</text>
  <text x="476" y="390" font-size="10" fill="#5B21B6" font-family="sans-serif">• Architect</text>
  <text x="476" y="406" font-size="10" fill="#5B21B6" font-family="sans-serif">• Product owner</text>
  <text x="476" y="422" font-size="10" fill="#5B21B6" font-family="sans-serif">• Scrum master</text>
  <text x="476" y="438" font-size="10" fill="#5B21B6" font-family="sans-serif">• Developer</text>
  <text x="476" y="454" font-size="10" fill="#5B21B6" font-family="sans-serif">• QA · UX · Orchestrator</text>

  <line x1="340" y1="468" x2="340" y2="498" stroke="#6D28D9" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="160" y="498" width="360" height="44" rx="8" fill="#4C1D95"/>
  <text x="340" y="518" font-size="12" font-weight="600" fill="#EDE9FE" font-family="sans-serif" text-anchor="middle">Production-grade software</text>
  <text x="340" y="534" font-size="10" fill="#C4B5FD" font-family="sans-serif" text-anchor="middle">Governed · traceable · auditable · enterprise-ready</text>
</svg>