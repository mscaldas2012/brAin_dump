<svg width="100%" viewBox="0 0 680 600" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>BMAD Workflow</title>
  <desc>BMAD multi-agent agile AI development workflow with specialized agent roles and quality gates</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6D28D9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-gate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="28" font-size="16" font-weight="600" fill="#4C1D95" font-family="sans-serif" text-anchor="middle">BMAD workflow</text>
  <text x="340" y="46" font-size="11" fill="#999" font-family="sans-serif" text-anchor="middle">Multi-agent · specialized roles · documentation as source of truth · quality gates at every handoff</text>

  <text x="76" y="72" font-size="10" font-weight="600" fill="#7C3AED" font-family="sans-serif" text-anchor="middle">ANALYSIS</text>
  <text x="218" y="72" font-size="10" font-weight="600" fill="#7C3AED" font-family="sans-serif" text-anchor="middle">PLANNING</text>
  <text x="360" y="72" font-size="10" font-weight="600" fill="#7C3AED" font-family="sans-serif" text-anchor="middle">SOLUTIONING</text>
  <text x="502" y="72" font-size="10" font-weight="600" fill="#7C3AED" font-family="sans-serif" text-anchor="middle">IMPLEMENTATION</text>

  <line x1="46" y1="78" x2="116" y2="78" stroke="#7C3AED" stroke-width="0.5" stroke-dasharray="3 2"/>
  <line x1="150" y1="78" x2="286" y2="78" stroke="#7C3AED" stroke-width="0.5" stroke-dasharray="3 2"/>
  <line x1="318" y1="78" x2="402" y2="78" stroke="#7C3AED" stroke-width="0.5" stroke-dasharray="3 2"/>
  <line x1="438" y1="78" x2="630" y2="78" stroke="#7C3AED" stroke-width="0.5" stroke-dasharray="3 2"/>

  <rect x="40" y="88" width="112" height="72" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="0.8"/>
  <text x="96" y="108" font-size="11" font-weight="600" fill="#4C1D95" font-family="sans-serif" text-anchor="middle">Analyst</text>
  <text x="96" y="124" font-size="10" fill="#5B21B6" font-family="sans-serif" text-anchor="middle">Requirements ·</text>
  <text x="96" y="138" font-size="10" fill="#5B21B6" font-family="sans-serif" text-anchor="middle">user research ·</text>
  <text x="96" y="152" font-size="10" fill="#5B21B6" font-family="sans-serif" text-anchor="middle">brief / PRD</text>

  <line x1="152" y1="124" x2="166" y2="124" stroke="#6D28D9" stroke-width="1" marker-end="url(#arr)"/>
  <polygon points="182,108 202,124 182,140 162,124" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8"/>
  <text x="182" y="120" font-size="9" font-weight="600" fill="#78350F" font-family="sans-serif" text-anchor="middle">Gate</text>
  <text x="182" y="132" font-size="9" fill="#92400E" font-family="sans-serif" text-anchor="middle">1</text>
  <line x1="202" y1="124" x2="216" y2="124" stroke="#D97706" stroke-width="1" marker-end="url(#arr-gate)"/>

  <rect x="216" y="88" width="112" height="72" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="0.8"/>
